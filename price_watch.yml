name: Se3ra Price Watch

on:
  schedule:
    - cron: "0 6 * * 1,5"
  workflow_dispatch: {}

jobs:
  price-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run price watch
        run: |
          python price_watch.py | tee report.txt

      - name: Add report to job summary
        run: |
          echo "## 📋 تقرير أسعار سعرة" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
